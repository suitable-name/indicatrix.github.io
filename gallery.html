  <figure class="fig diagram-fig">
<svg class="diagram" viewBox="0 0 900 300" role="img" aria-labelledby="handoff-title" xmlns="http://www.w3.org/2000/svg">
  <title id="handoff-title">Preview-then-handoff: the desktop renders a local preview while the camera moves, then a remote worker traces sample-index ranges that are summed into the same accumulator.</title>
  <style>
    .diagram text { font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace; font-size: 12.5px; fill: var(--ink); }
    .diagram .lbl { font-size: 11px; fill: var(--ink-2); letter-spacing: 0.06em; }
    .diagram .muted { fill: var(--ink-2); }
    .diagram .box { fill: none; stroke: var(--ink-2); stroke-width: 1; }
    .diagram .bar { fill: var(--paper-2); stroke: var(--rule); stroke-width: 1; }
    .diagram .arrow { fill: none; stroke: var(--accent); stroke-width: 1.5; }
    .diagram .head { fill: var(--accent); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>

  <rect class="box" x="20" y="34" width="300" height="168"/>
  <text class="lbl" x="34" y="56">DESKTOP · indicatrix-cut</text>
  <text x="34" y="86">camera moving</text>
  <text class="muted" x="34" y="106">  local CPU / GPU preview,</text>
  <text class="muted" x="34" y="124">  few samples, immediate</text>
  <text x="34" y="154">camera settled</text>
  <text class="muted" x="34" y="174">  hand sample tracing off</text>
  <text class="muted" x="34" y="192">  to the worker</text>

  <rect class="box" x="580" y="34" width="300" height="168"/>
  <text class="lbl" x="594" y="56">WORKER · indicatrix-worker</text>
  <text x="594" y="86">GPU / CPU path tracer</text>
  <text class="muted" x="594" y="106">  traces sample-index ranges</text>
  <text class="muted" x="594" y="124">  [0, 4096)  [4096, 8192) …</text>
  <text x="594" y="154">not screen tiles</text>
  <text class="muted" x="594" y="174">  no seams, no per-tile load</text>
  <text class="muted" x="594" y="192">  imbalance on a small stone</text>

  <path class="arrow" d="M 322 92 H 578" marker-end="url(#ah)"/>
  <text class="lbl" x="450" y="82" text-anchor="middle">mTLS 1.3 · token enrolment</text>
  <path class="arrow" d="M 578 152 H 322" marker-end="url(#ah)"/>
  <text class="lbl" x="450" y="174" text-anchor="middle">finished sample ranges, any order</text>

  <rect class="bar" x="20" y="232" width="860" height="48"/>
  <text class="lbl" x="34" y="252">ACCUMULATOR</text>
  <text x="34" y="270">local and remote samples are summed per pixel; the image converges as ranges arrive, whichever side produced them</text>
  <path class="arrow" d="M 170 204 V 230" marker-end="url(#ah)"/>
  <path class="arrow" d="M 730 204 V 230" marker-end="url(#ah)"/>
</svg>
<figcaption>Fig. 12 — Preview-then-handoff: local preview while the camera moves, remote sample-index ranges once it settles, one shared accumulator.</figcaption>
</figure>
